name: CI

on:
    push:
        # `m**/**` matches m0/foo, m12/foo, m99/foo. PRs to main always fire,
        # so this list only matters for direct branch pushes.
        branches: ['main', 'm**/**']
    pull_request:
        branches: ['main']

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Node 18 hit EOL April 2025; copy-webpack-plugin@14 needs Node
                # 20.9+. We test 20.x (current LTS) and 22.x (newer LTS).
                node-version: [20.x, 22.x]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - run: npm ci

            - name: Dependency-downgrade guard
              run: npm run check:deps

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Run tests
              run: npm test

            - name: Build plugin
              run: npm run dist
