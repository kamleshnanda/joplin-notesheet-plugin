name: CI

on:
  push:
    # `m**/**` matches m0/foo, m12/foo, m99/foo. PRs to main always fire,
    # so this list only matters for direct branch pushes.
    branches: [ "main", "m**/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run dist
