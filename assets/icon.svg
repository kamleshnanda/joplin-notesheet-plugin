<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Notesheet icon: a note page (folded top-right corner) holding a
       spreadsheet grid. Source for the manifest's 16/32/48/128 PNGs. -->
  <rect width="128" height="128" rx="26" fill="#1071d3"/>
  <!-- note page with folded corner -->
  <path d="M30 20h50l20 20v68a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z" fill="#ffffff"/>
  <path d="M80 20v14a6 6 0 0 0 6 6h14z" fill="#b9d6f5"/>
  <!-- header row -->
  <rect x="34" y="50" width="56" height="13" rx="2" fill="#1e9e5a"/>
  <!-- grid -->
  <g stroke="#1071d3" stroke-width="3" stroke-linecap="round" fill="none">
    <rect x="34" y="50" width="56" height="52" rx="2"/>
    <line x1="34" y1="63" x2="90" y2="63"/>
    <line x1="34" y1="76" x2="90" y2="76"/>
    <line x1="34" y1="89" x2="90" y2="89"/>
    <line x1="52.7" y1="50" x2="52.7" y2="102"/>
    <line x1="71.3" y1="50" x2="71.3" y2="102"/>
  </g>
</svg>
